server:
  port: 0

spring:
  application:
    name: auth-service-test

  datasource:
    url: jdbc:h2:mem:prestiq_auth_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

prestiq:
  security:
    jwt:
      secret: 0123456789012345678901234567890123456789012345678901234567890123
      expiration-seconds: 900
      refresh-token-expiration-days: 7
      issuer: prestiq-auth-test
    cookie:
      name: refreshToken
      secure: false
      same-site: Lax
      path: /api
