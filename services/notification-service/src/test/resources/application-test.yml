spring:
  application:
    name: notification-service-test

  datasource:
    url: jdbc:h2:mem:prestiq_notification_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

prestiq:
  security:
    jwt:
      secret: 0123456789012345678901234567890123456789012345678901234567890123
      issuer: prestiq-auth-service
    internal-service-key: prestiq-internal-test-key-2026
  services:
    application-service:
      url: http://localhost:8086
      timeout-ms: 1000
  notifications:
    batch-size: 50
    reminder-windows: 30,7,1
    scheduler:
      enabled: false
      cron: "-"
