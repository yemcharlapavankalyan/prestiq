server:
  port: ${RECOMMENDATION_SERVICE_PORT:8085}

spring:
  application:
    name: recommendation-service

  datasource:
    url: ${RECOMMENDATION_DB_URL:jdbc:postgresql://localhost:5432/prestiq_recommendation_db}
    username: ${RECOMMENDATION_DB_USERNAME:prestiq_user}
    password: ${RECOMMENDATION_DB_PASSWORD:prestiq_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

prestiq:
  security:
    jwt:
      secret: ${JWT_SECRET:d8f99e8cfb24d648849df63ba900221a8b3c9d0e1f2a3b4c5d6e7f8a9b0c1d2}
      issuer: ${JWT_ISSUER:prestiq-auth}
    internal-service-key: ${INTERNAL_SERVICE_KEY:prestiq-internal-dev-secret-key-2026}
  services:
    student-service:
      url: ${STUDENT_SERVICE_URL:http://localhost:8082}
      timeout-ms: 5000
    scholarship-service:
      url: ${SCHOLARSHIP_SERVICE_URL:http://localhost:8083}
      timeout-ms: 5000
    eligibility-service:
      url: ${ELIGIBILITY_SERVICE_URL:http://localhost:8084}
      timeout-ms: 10000
